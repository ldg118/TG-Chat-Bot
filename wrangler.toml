# TG Chat Bot - Cloudflare Workers 配置
# 入口：worker.js（D1 存储版）
name = "tg-chat-bot"
main = "worker.js"
compatibility_date = "2023-10-30"

# D1 数据库绑定（binding 名必须是 D1，代码按此名读取）
# 创建：wrangler d1 create tgchatbot，把返回的 database_id 填到下面
# 表结构在首次请求时自动创建，无需手动迁移
[[d1_databases]]
binding = "D1"
database_name = "tgchatbot"
database_id = "YOUR_D1_DATABASE_ID"

# 每日清理过期去重哈希（UTC）
[triggers]
crons = ["0 0 * * *"]

[vars]
BOT_TOKEN = ""          # Telegram Bot Token（建议部署时设为 Secret）
ADMIN_UID = ""          # 管理员 Telegram User ID
SUPERGROUP_ID = ""      # 话题模式群组 ID（以 -100 开头），私聊模式留空
TOPIC_MODE = "false"    # true=话题群组模式，false=私聊模式
WEBHOOK_SECRET = ""     # 留空则自动生成并存 D1
MAX_MSG_PER_MIN = "40"  # 频率限制（条/分钟），超限触发重新验证
