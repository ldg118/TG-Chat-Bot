name = "telegram-mirrotalk"
main = "worker.js"
compatibility_date = "2023-10-30"

# D1 database binding (replaces the old KV namespace).
# Create it with: wrangler d1 create mirrotalk
# then paste the returned database_id below. Tables are created automatically
# on first request (no manual migration needed).
[[d1_databases]]
binding = "DB"
database_name = "mirrotalk"
database_id = "YOUR_D1_DATABASE_ID"

# Daily cleanup of expired dedupe hashes (UTC).
[triggers]
crons = ["0 0 * * *"]

[vars]
# Telegram Bot Token from @BotFather
ENV_BOT_TOKEN = ""

# A secret token for securing the webhook. Optional: if left empty, a UUID will be auto-generated and saved to D1.
ENV_BOT_SECRET = ""

# Your Telegram User ID (get from @userinfobot)
ENV_ADMIN_UID = ""

# Enable topic-group mode by default (can be switched at runtime with /mode)
ENV_ENABLE_TOPIC_GROUP = "false"

# Supergroup ID (starts with -100). Required only when topic mode is enabled.
ENV_SUPERGROUP_ID = ""

# Rate limit: max messages per minute per user before re-verification is forced
ENV_MAX_MSG_PER_MIN = 40
